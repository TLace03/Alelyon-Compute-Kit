[build-system]
requires = []
build-backend = "_build_backend"
backend-path = ["tools"]

[project]
name = "alelyon-ai"
version = "0.1.0a2"
description = "Experimental vendor-neutral compute SDK with explicit native execution"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "THIRD-PARTY-NOTICES.txt"]
dependencies = []

[project.optional-dependencies]
numpy = ["numpy>=1.26"]
torch = ["numpy>=1.26", "torch>=2.9"]
dev = ["build>=1.2", "pytest>=8"]

[project.urls]
Repository = "https://github.com/TLace03/Alelyon-Compute-Kit"
Issues = "https://github.com/TLace03/Alelyon-Compute-Kit/issues"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
