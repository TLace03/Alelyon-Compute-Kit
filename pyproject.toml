[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "alelyon-ai"
version = "0.1.0a0"
description = "Vendor-neutral compute SDK with explicit backend capability contracts"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Thomas Lacy"}]
dependencies = []
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.optional-dependencies]
dev = ["build>=1.2", "pytest>=8"]

[project.urls]
Repository = "https://github.com/TLace03/Alelyon-Compute-Kit"
Issues = "https://github.com/TLace03/Alelyon-Compute-Kit/issues"

[tool.setuptools.packages.find]
where = ["src"]
include = ["alelyon_compute_kit", "alelyon_compute_kit.*"]
namespaces = false

[tool.setuptools.package-data]
alelyon_compute_kit = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
