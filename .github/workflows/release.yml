name: Publish Python distribution

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the verified artifacts to PyPI
        required: true
        type: boolean
        default: false
      expected_version:
        description: Exact experimental source version
        required: true
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.14"]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --disable-pip-version-check --no-input "pip==26.2.1" "pytest==9.1.1" "numpy>=1.26"
      - name: Check requested source version without package import
        env:
          EXPECTED_VERSION: ${{ inputs.expected_version }}
        working-directory: tools
        run: python -c "import os, _build_backend as b; assert os.environ['EXPECTED_VERSION'] == b.VERSION; b.sources()"
      - run: python -m pytest -q

  build:
    needs: test
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check --no-input "pip==26.2.1" "build==1.6.0" "twine==7.0.0"
      - run: rustup toolchain install 1.97.1 --profile minimal
      - name: Build plain release DLL from fresh target
        shell: pwsh
        run: |
          python tools/build_native.py --target-dir "$env:RUNNER_TEMP/ack-native-target"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Package exact wheel and source-only sdist
        run: python -m build --no-isolation --sdist --wheel --outdir dist
      - name: Resolve and verify exact artifacts
        shell: pwsh
        run: |
          $wheels = @(Get-ChildItem -LiteralPath dist -Filter *.whl)
          $sdists = @(Get-ChildItem -LiteralPath dist -Filter *.tar.gz)
          if ($wheels.Count -ne 1 -or $sdists.Count -ne 1) { throw 'artifact-count-refused' }
          python tools/verify_distribution.py --wheel $wheels[0].FullName --sdist $sdists[0].FullName
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m twine check --strict $wheels[0].FullName $sdists[0].FullName
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Clean install outside checkout; no device construction
        shell: pwsh
        run: |
          $checkRoot = Join-Path $env:RUNNER_TEMP 'ack-clean-install'
          if (Test-Path -LiteralPath $checkRoot) { throw 'clean-check-target-exists' }
          python -m venv $checkRoot
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $checkPython = Join-Path $checkRoot 'Scripts/python.exe'
          $wheel = @(Get-ChildItem -LiteralPath dist -Filter *.whl)[0].FullName
          & $checkPython -I -m pip install --no-deps --disable-pip-version-check --no-input $wheel
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item -LiteralPath tools/clean_install_check.py -Destination $checkRoot
          Push-Location $checkRoot
          try {
            & $checkPython -I -m pip check
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            & $checkPython -I clean_install_check.py --native-identity
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } finally { Pop-Location }
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: verified-distributions
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish == true && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/p/alelyon-ai
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: verified-distributions
          path: dist
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33
        with:
          packages-dir: dist/
